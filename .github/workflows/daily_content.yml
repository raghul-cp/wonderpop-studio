name: WonderPop Daily Content

# Runs once a day and on manual trigger. The cron below is in UTC.
# 01:30 UTC ≈ 07:00 IST — adjust to whenever you want fresh content ready.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Force a category id (leave blank for weighted-random)"
        required: false
        default: ""
      enable_upload:
        description: "Upload the assembled video to YouTube this run?"
        required: false
        default: "false"

permissions:
  contents: write   # needed so the workflow can commit generated scripts/metadata back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # --- Free by default. Nothing below is required for the pipeline to run. ---
      CONTENT_ENGINE: template          # template | ollama | anthropic
      ENABLE_VIDEO_ASSEMBLY: "true"
      ENABLE_IMAGE_GENERATION: "true"
      ENABLE_VOICEOVER_AUDIO: "true"
      # Upload stays off unless you set the enable_upload input to "true"
      # AND have added the three YOUTUBE_* secrets below (see SETUP.md).
     ENABLE_UPLOAD: ${{ github.event_name == 'schedule' || github.event.inputs.enable_upload == 'true' }}
      # Optional paid upgrade — only used if CONTENT_ENGINE=anthropic is also set.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Required only once upload is turned on (see SETUP.md to generate these).
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg (required for video assembly)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily content pipeline
        run: |
          if [ -n "${{ github.event.inputs.category }}" ]; then
            python -m src.main --category "${{ github.event.inputs.category }}"
          else
            python -m src.main
          fi

      - name: Commit generated content back to the repo
        run: |
          git config user.name "wonderpop-bot"
          git config user.email "actions@github.com"
          git add data/ideas data/scripts data/metadata
          git diff --cached --quiet || git commit -m "Daily content: $(date -u +'%Y-%m-%d')"
          git push

      - name: Upload video/audio as a workflow artifact (kept 7 days)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wonderpop-media-${{ github.run_id }}
          path: data/media
          retention-days: 7
          if-no-files-found: ignore
